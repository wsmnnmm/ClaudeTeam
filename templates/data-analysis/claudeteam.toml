# Data analysis team — analytics lead (frame + dispatch + vet rigor) + data engineer + analyst + reporting/viz
#
# Usage: copy this folder's contents (this toml + the *.md playbooks) next to your
#        claudeteam.toml — `playbook` paths resolve relative to the config file.
#        Tweak cli/model/role/playbook for your project, then
#        `claudeteam feishu connect` (writes chat_id) → `claudeteam up`.
# Each playbook becomes its agent's CLAUDE.md / AGENTS.md body, on top of the team protocol.

chat_id       = ""                        # written by `claudeteam feishu connect`
default_model = "opus"

[team]
session = "ClaudeTeam"

[team.agents.manager]
cli        = "claude-code"
model      = "opus"
role       = "Analytics Lead"
playbook   = "manager.md"
card_color = "blue"

[team.agents.data_engineer]
cli        = "claude-code"
model      = "sonnet"
role       = "Data Engineer"
playbook   = "data_engineer.md"
card_color = "purple"

[team.agents.analyst]
cli        = "claude-code"
model      = "sonnet"
role       = "Data Analyst"
playbook   = "analyst.md"
card_color = "green"

[team.agents.viz]
cli        = "claude-code"
model      = "sonnet"
role       = "Reporting & Viz"
playbook   = "viz.md"
card_color = "orange"

# Other sections ([chat.publish] visibility / [feishu] bridge) default if omitted;
# see DEPLOYMENT's "Configuration" section to tune them.
