# Software development team — tech lead (dispatch + review) + backend + frontend + code review/QA
#
# Usage: copy this folder's contents (this toml + the *.md playbooks) next to your
#        claudeteam.toml — `playbook` paths resolve relative to the config file.
#        Tweak cli/model/role/playbook for your project, then
#        `claudeteam feishu connect` (writes chat_id) → `claudeteam up`.
# Each playbook becomes its agent's CLAUDE.md / AGENTS.md body, on top of the team protocol.

chat_id       = ""                        # written by `claudeteam feishu connect`
default_model = "opus"

[team]
session = "ClaudeTeam"

[team.agents.manager]
cli        = "claude-code"
model      = "opus"
role       = "Tech Lead"
playbook   = "manager.md"
card_color = "blue"

[team.agents.backend]
cli        = "codex-cli"
role       = "Backend Engineer"
playbook   = "backend.md"
card_color = "purple"

[team.agents.frontend]
cli        = "claude-code"
model      = "sonnet"
role       = "Frontend Engineer"
playbook   = "frontend.md"
card_color = "green"

[team.agents.qa]
cli        = "claude-code"
model      = "sonnet"
role       = "Code Review / QA"
playbook   = "qa.md"
card_color = "orange"

# Other sections ([chat.publish] visibility / [feishu] bridge) default if omitted;
# see DEPLOYMENT's "Configuration" section to tune them.
